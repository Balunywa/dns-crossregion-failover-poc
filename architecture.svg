<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" style="max-width:100%;height:auto" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Azure client-side cross-region DNS failover POC</title>
  <desc id="desc">East Windows and Ubuntu clients use Azure platform DNS and an East linked forwarding ruleset as primary. Their secondary is a West inbound resolver reached over direct global peering. Each region has one independent upstream. Removing East hub peering does not remove the East ruleset service link.</desc>
  <defs>
    <marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/></marker>
    <marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#087f5b"/></marker>
    <marker id="purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7048b8"/></marker>
    <style>
      text {font-family:Segoe UI,Arial,sans-serif;fill:#172b4d}
      .title {font-size:32px;font-weight:700}
      .head {font-size:24px;font-weight:700}
      .label {font-size:21px;font-weight:600}
      .body {font-size:19px}
      .small {font-size:17px}
      .box {fill:white;stroke:#b5c5db;stroke-width:2}
      .traffic {fill:none;stroke:#1565c0;stroke-width:3;marker-end:url(#blue)}
      .service {fill:none;stroke:#7048b8;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#purple)}
      .secondary {fill:none;stroke:#087f5b;stroke-width:4;marker-end:url(#green)}
      .fault {fill:#fff4e5;stroke:#d97706;stroke-width:2}
    </style>
  </defs>
  <rect width="1600" height="1120" fill="#f4f7fb"/>
  <text x="40" y="52" class="title">Azure DNS: native client cross-region failover</text>
  <text x="40" y="86" class="body">One independent upstream per region. Regional answer fingerprints prove which path served the query.</text>

  <rect x="35" y="120" width="445" height="535" rx="14" fill="#eaf2ff" stroke="#b5c5db"/>
  <text x="58" y="158" class="head">East spoke - East US</text>
  <text x="58" y="188" class="body">VNet: 10.20.0.0/16</text>
  <rect x="60" y="215" width="395" height="105" rx="9" class="box"/>
  <text x="80" y="245" class="label">Windows Server 2022 - 10.20.0.4</text>
  <text x="80" y="276" class="body">.NET DNS API -&gt; Windows DNS Client</text>
  <text x="80" y="301" class="small">Native retries; pktmon ETL + pcapng</text>
  <rect x="60" y="340" width="395" height="105" rx="9" class="box"/>
  <text x="80" y="370" class="label">Ubuntu 24.04 - 10.20.0.5</text>
  <text x="80" y="401" class="body">getaddrinfo -&gt; libc -&gt; systemd-resolved</text>
  <text x="80" y="426" class="small">Native retries; tcpdump pcap</text>
  <rect x="60" y="470" width="395" height="100" rx="9" fill="#dbeafe" stroke="#1565c0" stroke-width="2"/>
  <text x="80" y="500" class="label">Ordered OS / NIC DNS servers</text>
  <text x="80" y="529" class="body">1. 168.63.129.16 - Azure DNS</text>
  <text x="80" y="555" class="body">2. 10.30.0.4 - West inbound</text>
  <text x="60" y="607" class="small">Unique names: *.lab.failover.test</text>
  <text x="60" y="632" class="small">No application retry or manual server race</text>

  <rect x="565" y="120" width="460" height="610" rx="14" fill="#f0ebff" stroke="#c7b5e5"/>
  <text x="590" y="158" class="head">East regional resolution path</text>
  <text x="590" y="188" class="body">Platform service + hub 10.10.0.0/16</text>
  <rect x="590" y="215" width="410" height="90" rx="9" class="box"/>
  <text x="610" y="247" class="label">Azure DNS - 168.63.129.16</text>
  <text x="610" y="277" class="body">Originating East spoke VNet context</text>
  <rect x="590" y="350" width="410" height="90" rx="9" class="box"/>
  <text x="610" y="381" class="label">East forwarding ruleset</text>
  <text x="610" y="411" class="body">Links: East spoke + East hub</text>
  <rect x="590" y="480" width="410" height="70" rx="9" class="box"/>
  <text x="610" y="510" class="label">East outbound endpoint</text>
  <text x="610" y="537" class="body">Dedicated subnet: 10.10.1.0/28</text>
  <rect x="590" y="590" width="410" height="100" rx="9" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="610" y="620" class="label">East upstream - 10.10.2.4</text>
  <text x="610" y="650" class="body">Sole regional target; UDP + TCP 53</text>
  <text x="610" y="676" class="label">A = 192.0.2.10, TTL = 0</text>
  <path d="M455 500 H520 V260 H590" class="traffic"/>
  <rect x="468" y="335" width="89" height="30" fill="#f4f7fb"/>
  <text x="470" y="357" class="small" fill="#1565c0">Primary</text>
  <path d="M795 305 V350" class="service"/>
  <path d="M795 440 V480" class="traffic"/>
  <path d="M795 550 V590" class="traffic"/>
  <text x="819" y="332" class="small">Service link</text>

  <rect x="1100" y="120" width="465" height="610" rx="14" fill="#e7f5ef" stroke="#a8d6bf"/>
  <text x="1125" y="158" class="head">West hub - West US</text>
  <text x="1125" y="188" class="body">VNet: 10.30.0.0/16</text>
  <rect x="1125" y="215" width="415" height="90" rx="9" class="box"/>
  <text x="1145" y="247" class="label">West inbound - 10.30.0.4</text>
  <text x="1145" y="277" class="body">DNS resolves in West hub context</text>
  <rect x="1125" y="350" width="415" height="90" rx="9" class="box"/>
  <text x="1145" y="381" class="label">West forwarding ruleset</text>
  <text x="1145" y="411" class="body">Linked to West hub only</text>
  <rect x="1125" y="480" width="415" height="70" rx="9" class="box"/>
  <text x="1145" y="510" class="label">West outbound endpoint</text>
  <text x="1145" y="537" class="body">Dedicated subnet: 10.30.1.0/28</text>
  <rect x="1125" y="590" width="415" height="100" rx="9" fill="#d3f2e4" stroke="#087f5b" stroke-width="2"/>
  <text x="1145" y="620" class="label">West upstream - 10.30.2.4</text>
  <text x="1145" y="650" class="body">Sole regional target; UDP + TCP 53</text>
  <text x="1145" y="676" class="label">A = 192.0.2.20, TTL = 0</text>
  <path d="M1330 305 V350" class="service"/>
  <path d="M1330 440 V480" class="traffic"/>
  <path d="M1330 550 V590" class="traffic"/>
  <path d="M455 550 H490 V775 H1060 V260 H1125" class="secondary"/>
  <rect x="390" y="756" width="585" height="36" fill="#f4f7fb"/>
  <text x="405" y="782" class="label" fill="#087f5b">Secondary: direct global VNet peering to West</text>

  <rect x="35" y="815" width="1530" height="120" rx="12" class="fault"/>
  <text x="58" y="848" class="head">Fault locations and independence</text>
  <text x="58" y="879" class="body">1. Client firewall drops only DNS to 168.63.129.16.  2. East upstream drops outbound-subnet DNS, or returns SERVFAIL.</text>
  <text x="58" y="908" class="body">3. Remove East spoke/hub peering: the East ruleset service link remains. West peering and West upstream stay independent.</text>
  <rect x="35" y="958" width="1530" height="120" rx="12" class="box"/>
  <text x="58" y="991" class="head">Control and evidence plane</text>
  <text x="58" y="1023" class="body">Local Bicep + Python -&gt; Azure ARM / VM Run Command -&gt; guest tests + captures -&gt; private Blob -&gt; local decode + validation.</text>
  <text x="58" y="1051" class="small">Solid blue: DNS processing. Purple dashed: service association, not routing. Green: secondary network path. Responses return in reverse.</text>
  <text x="40" y="1104" class="small">East inbound 10.10.0.4 is also deployed, but is not the normal primary. Fast-SERVFAIL control and full sequences: ARCHITECTURE.md.</text>
</svg>
